services:
  - type: web
    name: trustvault-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    disk:
      name: vault-storage
      mountPath: ./backend/storage/vault
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_MASTER_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://trustvault-vert.vercel.app,http://localhost:5173"
